<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Springs Art Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Container -->
    <div class="glass-container">
        
        <!-- Logo at the Top -->
        <header>
            <img src="logo.png" alt="Company Logo" class="logo">
        </header>

        <!-- Introductory Text -->
        <section class="intro-text">
            <h1>SPRINGS ART GALLERY</h1>
            <p>Download the official documents for the 2026 - 2027 Exhibition programme.</p>
            <p>For general inquiries contact: <a href="mailto:Nkosinathi.Gumede@ekurhuleni.gov.za" class="contact-link">Nkosinathi Gumede</a></p>
        </section>

        <!-- 3 Category Download Grid -->
        <div class="download-grid">
            
            <!-- Category 1: Guidelines -->
            <div class="card">
                <h3>Guidelines</h3>
                <p>Terms & Eligibility</p>
                <a href="guidelines.pdf" download class="btn">Download PDF</a>
            </div>

            <!-- Category 2: Fillable Form -->
            <div class="card">
                <h3>Fillable Form</h3>
                <p>Application Doc</p>
                <a href="application-form.pdf" download class="btn">Download PDF</a>
            </div>

            <!-- Category 3: Floor Plan -->
            <div class="card">
                <h3>Floor Plan</h3>
                <p>Venue Layout</p>
                <a href="floor-plan.pdf" download class="btn">Download PDF</a>
            </div>

        </div>
    </div>

</body>
</html>
